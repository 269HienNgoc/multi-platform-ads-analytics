app:
  name: multi-platform-ads-analytics
  environment: development

server:
  address: 127.0.0.1:8080
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
  max_header_bytes: 1048576
  # Required in production. Send the same value in the X-API-Key header.
  api_key: ""

database:
  host: 127.0.0.1
  port: 5432
  name: multi_platform_ads
  user: postgres
  # Set the password used by the PostgreSQL user. Empty is allowed for local trusted auth only.
  password: ""
  ssl_mode: disable
  timezone: UTC
  connect_timeout: 10s
  max_open_connections: 25
  max_idle_connections: 10
  connection_max_lifetime: 30m
  connection_max_idle_time: 5m
  slow_query_threshold: 500ms

meta:
  enabled: false
  base_url: https://graph.facebook.com
  version: v24.0
  # Required when enabled is true. Never commit a real production token.
  access_token: ""
  timeout: 30s
  sync_interval: 15m

log:
  level: debug
  encoding: console
